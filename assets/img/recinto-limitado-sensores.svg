<text x="32" y="550" font-size="12.5" fill="#18191B">Sismo: acelerómetro en cada nodo + receptor oficial SASMEX en R0 (fase 2). Falta de energía: monitor de red y batería LiFePO4 en cada nodo.</text>
<text x="32" y="570" font-size="12.5" fill="#18191B">Vientos fuertes y tsunami: boletín oficial recibido por el servidor; no requieren sensor en el recinto.</text>
<text x="32" y="610" font-size="11" fill="#7c8088">SOSistem™ · Sistema S.O.S.© (Safe Creative 2609046908578) · © Víctor Hugo Ramírez Salgado · Asistencia-IA</text>
