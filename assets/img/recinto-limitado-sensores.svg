<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="t d" font-family="Inter,Arial,sans-serif">
<title id="t">Integración de sensores en recinto limitado · prueba ContenedorEns©</title>
<desc id="d">Plano ilustrativo con los recintos R0 Entrada principal, R1 Sanitarios con cuatro cabinas, R2 Oficina, R3 Cocina y R4 Bodega y taller, con la posición propuesta de sensores de caídas, radar de aforo, gases, oxígeno, agua en el piso, micrófono de palabra S.O.S. sin grabación, pantallas interiores y la pantalla exterior.</desc>
<rect width="960" height="630" fill="#ffffff"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#18191B">Sensores por recinto · prueba <tspan fill="#C0541A">ContenedorEns©</tspan></text>
<text x="32" y="68" font-size="13" fill="#55585E">Orden obligatorio: 1.º entrada principal, 2.º baños, 3.º lo que el cliente requiera. Plano ilustrativo, no a escala.</text>

