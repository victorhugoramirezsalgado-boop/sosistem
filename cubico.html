<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Código Cúbico© · en preparación</title>
<meta name="theme-color" content="#0b1a2a">
<style>
  :root{--bg:#0b1a2a;--s1:#11263b;--line:#2a4560;--ink:#eef2f6;--ink2:#a9b8c7;--acento:#3b82f6;--beige:#e9dfc8}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
  .card{max-width:520px;width:100%;background:var(--s1);border:2px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
  .ceja{font:700 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--beige);margin-bottom:8px}
  h1{font-size:26px;margin:0 0 10px;line-height:1.2}
  p{color:var(--ink2);margin:0 0 18px}
  a.btn{display:inline-block;min-height:50px;line-height:50px;padding:0 22px;border-radius:12px;background:var(--acento);border:2px solid #7fb0ff;color:#fff;text-decoration:none;font:700 16px system-ui}
  .pie{color:var(--ink2);font-size:12px;margin-top:18px}
</style>
</head>
<body>
  <main class="card">
    <div class="ceja">SOSistem™</div>
    <h1>El lector del Código Cúbico© está en preparación</h1>
    <p>Esta página aún no está disponible al público. Pronto podrás leer y generar tu Código Cúbico© desde aquí.</p>
    <a class="btn" href="/">Ir a SOSistem™</a>
    <div class="pie">© Víctor Hugo Ramírez Salgado · Código Cúbico© y Cubo de la Comunicación (33)© — obras registradas en Safe Creative</div>
  </main>
  <script>
    // Si el QR puente trae datos en la liga (p. ej. una huella), se borran de la barra
    // de direcciones al abrir: no se muestran, no se guardan y no se envían.
    try { if (location.search || location.hash) history.replaceState(null, "", location.pathname); } catch (e) {}
  </script>
</body>
</html>
