<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verificar constancia · SOSistem™</title>
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<style>
:root{--ok:#237F52;--bad:#9B2423;--ink:#0f1b2d;--ink2:#4a5568;--line:#dde2ea}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(15,27,45,.08)}
h1{font-size:1.2rem;margin:0}.est{padding:14px;border-radius:12px;font-weight:700}.est.ok{background:#e6f4ec;color:var(--ok)}.est.bad{background:#f8e6e6;color:var(--bad)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}dt{color:var(--ink2)}dd{margin:0;font-weight:600}small{color:var(--ink2)}
.cc{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:10px}.cc svg{width:100%;height:46px}.cc small{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;overflow-wrap:anywhere}
form{display:grid;gap:8px}input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px}button{font:700 1rem system-ui;padding:10px;border:0;border-radius:10px;background:#DB641C;color:#fff}
</style>
</head>
<body>
<main>
<img src="assets/logo.svg" alt="SOSistem™" width="56" height="60">
<h1>Verificar constancia de reconocimiento</h1>
<div id="res"></div>
<form id="f"><input name="f" placeholder="Folio (SOS-AP-…)" required><input name="h" placeholder="Huella (16 caracteres)" required><button>Verificar</button></form>
<small>La verificación compara el folio y la huella con el registro del sistema. No muestra datos personales. Esta constancia no es un comprobante fiscal. © Víctor Hugo Ramírez Salgado</small>
</main>
<script src="assets/cubo-rt.js?v=5.7b10"></script>
<script src="assets/codigo-cubico.js?v=5.7b10"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), F = document.getElementById("f"), R = document.getElementById("res");
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  async function ver(folio, h) {
    let lista = []; try { lista = await (await fetch("datos/constancias.json?t=" + Date.now(), { cache: "no-store" })).json(); } catch (e) {}
    const c = lista.find((x) => x.folio === folio.trim() && x.huella === h.trim().toUpperCase());
    R.innerHTML = c ? `<div class="est ok">✓ Constancia válida</div><dl><dt>Folio</dt><dd>${esc(c.folio)}</dd><dt>Fecha</dt><dd>${esc(c.fecha)}</dd><dt>Apoyo</dt><dd>${esc(c.tipo)}</dd><dt>Otorgada a</dt><dd>${esc(c.iniciales)}</dd></dl>${window.CodigoCubico ? `<div class="cc">${CodigoCubico.barras(c.huella)}<small>${esc(CodigoCubico.texto(c.huella))}</small><small>${esc(CodigoCubico.ref)}</small><small>Compare este Código Cúbico con el impreso en la constancia.</small></div>` : ""}`
      : `<div class="est bad">✗ No se encontró una constancia con ese folio y esa huella.</div>`;
  }
  if (q.get("f") && q.get("h")) { F.f.value = q.get("f"); F.h.value = q.get("h"); ver(q.get("f"), q.get("h")); }
  F.onsubmit = (e) => { e.preventDefault(); ver(F.f.value, F.h.value); };
})();
</script>
</body>
</html>
